name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Report every leg.  With fail-fast a single job failure cancels the
      # others mid-flight and hides their results — which is how the
      # OpenSeesPy and h5py failures stayed invisible for five runs.
      fail-fast: false
      matrix:
        # 3.9 is deliberately absent from this matrix: ``opstool`` (a *core*
        # dependency) declares ``Requires-Python: >=3.10``, so on 3.9 pip
        # backtracks to an ancient opstool that pulls in matplotlib 3.0.3 and
        # dies building it from source.  Python 3.9 *syntax* compatibility is
        # still enforced for the Rhino 8 embedded interpreter through ruff
        # ``target-version = "py39"``.
        # 3.12 resolves OpenSeesPy 3.8.0.0 (``openseespylinux`` 3.8.0.0 needs
        # Python >= 3.12), the build that provides ``ops.equationConstraint``
        # for the penalty edge constraints — 3.10 gets OpenSeesPy 3.7.1.2.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for setuptools-scm versioning

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries
        # ubuntu-latest does not ship two shared libraries the suite dlopens:
        #   libGLU.so.1 -> libglu1-mesa  (gmsh, imported by tests/test_mesh.py)
        #   libEGL.so.1 -> libegl1       (VTK >= 9.5 headless off-screen
        #                                 rendering; Xvfb is not required)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa \
            libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[report,mesh-remesh]"
          # Test-only tools.  h5py is an optional *runtime* dependency used
          # only by the HDF5 stage/results paths; installing it here keeps
          # those tests running instead of skipping.  The tests guard with
          # pytest.importorskip, so a minimal install still passes.
          # IPython backs the *notebook* display path (pyvista's static-image
          # fallback) exercised by the notebook-mode plotting tests; a real
          # Jupyter session already provides it.
          pip install ruff pytest h5py ipython

      - name: Register OpenSeesPy bundled libraries
        # The Linux OpenSeesPy wheel bundles libblas/liblapack/libgfortran
        # (and libgomp/libquadmath) beside opensees.so and relies on
        # DT_RUNPATH=$ORIGIN/lib.  RUNPATH is *not* inherited by the bundled
        # libraries, so liblapack's own dependency on libblas/libgfortran is
        # resolved only via LD_LIBRARY_PATH (or the system ldconfig cache).
        # ubuntu-latest has neither a system BLAS nor libgfortran.so.4, so
        # `import openseespy.opensees` fails with
        # "libblas.so.3: cannot open shared object file" and pytest aborts
        # with 15 collection errors (exit code 2).
        # This step must run *after* the install above so ``openseespylinux``
        # is importable and ``find_spec`` resolves to a real spec.
        run: |
          OSLIB="$(python -c 'import importlib.util, os; s = importlib.util.find_spec("openseespylinux"); print(os.path.join(os.path.dirname(s.origin), "lib"))')"
          test -d "$OSLIB"
          echo "OpenSeesPy bundled libraries: $OSLIB"
          echo "LD_LIBRARY_PATH=$OSLIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests examples

      - name: Test (pytest, excluding slow)
        run: pytest -q -m "not slow" -p no:cacheprovider

  gui-test:
    runs-on: ubuntu-latest
    # The GUI is an optional extra (PySide6 + pyvistaqt) whose Qt/PyVista
    # install is ~430 MB; it gets its own single-version job so the main
    # matrix stays lean.  The Qt tests are ``needs_gui``-marked and skip in
    # ``lint-and-test``, which does not install the extra.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for setuptools-scm versioning

      - uses: actions/setup-python@v5
        with:
          # One version only.  The [gui] extra's floor is 3.10 (driven by
          # pyvistaqt); 3.12 matches the interpreter the Qt stack was
          # validated on.
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        # The viewport is a QVTKRenderWindowInteractor, so Qt needs the system
        # GL stack even head-less: libEGL for VTK's off-screen path, plus the
        # GLU/xkb/font/dbus libraries Qt6Gui links against on ubuntu-latest.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install dependencies (with the [gui] extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install ruff pytest

      - name: Register OpenSeesPy bundled libraries
        # Future GUI tests (analysis actions) import ``AnalysisBuilder`` ->
        # ``openseespy.opensees``; the bundled BLAS/LAPACK live beside
        # ``opensees.so`` and resolve only via LD_LIBRARY_PATH here.  Same
        # rationale as the main job.
        run: |
          OSLIB="$(python -c 'import importlib.util, os; s = importlib.util.find_spec("openseespylinux"); print(os.path.join(os.path.dirname(s.origin), "lib"))')"
          test -d "$OSLIB"
          echo "OpenSeesPy bundled libraries: $OSLIB"
          echo "LD_LIBRARY_PATH=$OSLIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Check the Qt platform plugin
        # Runs outside pytest, so tests/conftest.py does not apply -- set the
        # platform explicitly.  Publishes the outcome as a check annotation,
        # since job logs need repository admin rights.
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -c "from qtpy.QtWidgets import QApplication; app = QApplication([]); print('PLATFORM=' + app.platformName())" > /tmp/q.log 2>&1
          rc=$?
          cat /tmp/q.log
          MSG=$(tail -c 2000 /tmp/q.log | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=Qt platform::$MSG"
          else
            echo "::error title=Qt platform check failed::$MSG"
          fi
          exit "$rc"

      - name: Test (GUI, head-less)
        # tests/conftest.py forces QT_QPA_PLATFORM=offscreen when DISPLAY is
        # absent, so no X server is required.  On failure the pytest tail is
        # republished as a check annotation: job logs need repository admin
        # rights, so an annotation is the only channel the maintainers'
        # tooling can read back.
        run: |
          set +e
          pytest -q tests/test_gui_*.py -m "not slow" -p no:cacheprovider 2>&1 | tee /tmp/gui.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            MSG=$(tail -c 3000 /tmp/gui.log | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=GUI test output::$MSG"
          fi
          exit "$rc"
