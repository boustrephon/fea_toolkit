name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install ".[docs]"

      - name: Regenerate documentation index
        run: python docs/_generate_index.py

      - name: Build MkDocs site (strict)
        run: mkdocs build --strict
        env:
          # Two independent MkDocs 2.0 notices appear during a build; both are
          # noisy but not strict-failing, and each package has its own opt-out:
          #   - mkdocs-gen-files (via its `properdocs` dependency)
          #       -> DISABLE_MKDOCS_2_WARNING
          #   - mkdocs-material theme (the boxed "Material for MkDocs team" notice)
          #       -> NO_MKDOCS_2_WARNING
          DISABLE_MKDOCS_2_WARNING: "true"
          NO_MKDOCS_2_WARNING: "true"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5