site_name: fea_toolkit
site_description: FEA to OpenSees/Rhino conversion toolkit
site_url: https://boustrephon.github.io/fea_toolkit/
repo_url: https://github.com/boustrephon/fea_toolkit
edit_uri: blob/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            # griffe 1.x/2.x warns on every unannotated parameter/return;
            # that is pervasive styling noise in this codebase, so keep the
            # gate focused on real docstring bugs (unknown params, malformed
            # sections) instead. Indentation/unknown-param warnings stay on.
            docstring_options:
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_category_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
  - gen-files:
      scripts:
        - docs/_generate_index.py

nav:
  - Home: README.md
  - Documentation Index: README.md
  - LLM / AI Assistant Guide: llm_guide.md
  - Core Pipeline:
      - Analysis Workflow: workflow.md
      - Builder Reference: builder_reference.md
      - Layered Analysis Workflow: layered_analysis_workflow.md
      - Typed Analysis Orchestration: analysis.md
  - Analysis Types:
      - Modal Analysis: modal_analysis.md
      - Pushover Analysis: pushover_analysis.md
      - Nonlinear Dynamic Analysis: nonlinear_dynamic_analysis.md
      - Storey Response: storey_response.md
      - Report Generation: report_generation.md
  - Model Features:
      - Element Classification: element_classification.md
      - Element Splitting: element_splitting.md
      - Element Properties Config: element_properties_config.md
      - Shell Element Support: shell_support.md
      - Stiffness Factors: stiffness_factors.md
      - Constraint Edge Detection: constraint_detection.md
      - Diaphragm Constraints & Storey ID: diaphragm_constraints.md
      - Mander Confinement Validation: mander_confinement_validation.md
      - Capacity Modules (GB 50010): capacity.md
  - Export & Visualisation:
      - Rhino 3-D Export: rhino_export.md
      - Tcl Export: tcl_export.md
      - Visualisation Toolkit: viewer.md
      - Results Schema: results_schema.md
  - Tool-Specific Workflows:
      - Xara/OpenSeesRT Tcl Runtime: xara_tcl_runtime_guide.md
      - Xara Pushover Workflow: xara_pushover_workflow.md
      - Xara Gravity & Solver: xara_gravity_and_solver.md
  - Planning:
      - Migration Plan: analysis_builder_migration_plan.md
      - Deprecation Plan: deprecation_plan.md
      - Development Notes: dev_notes.md
  - API Reference:
      - model: api/model.md
      - io: api/io.md
      - opensees: api/opensees.md
      - analysis: api/analysis.md
      - capacity: api/capacity.md
      - mesh: api/mesh.md
      - plotting: api/plotting.md
      - rhino: api/rhino.md
